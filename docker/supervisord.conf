[supervisord]
nodaemon=true

[program:mariadb]
command=/usr/sbin/mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --skip-character-set-client-handshake --skip-innodb-read-only-compressed
user=mysql
autorestart=true
stdout_logfile=/var/log/supervisor/mariadb.log
stderr_logfile=/var/log/supervisor/mariadb.err

[program:redis]
command=/usr/bin/redis-server
autorestart=true
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis.err

[program:frappe]
command=/bin/bash /workspace/init.sh
directory=/home/frappe
autorestart=true
stdout_logfile=/var/log/supervisor/frappe.log
stderr_logfile=/var/log/supervisor/frappe.err
